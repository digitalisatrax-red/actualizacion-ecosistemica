<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caldas · Áreas protegidas</title>
<style>
@font-face{font-family:Anton;src:url(assets/b9beea0804.woff2) format('woff2');font-weight:400}
:root{--ink:#1d2b33;--muted:#55656d;--green:#2b9a78;--bg:#fff6d9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#faefcb linear-gradient(160deg,#fffbe8 0,#faefcb 55%,#f3e3b4 100%);color:var(--ink);font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.wrap{display:grid;grid-template-columns:minmax(280px,34%) 1fr;gap:2.2vw;height:100vh;height:100dvh;padding:clamp(52px,7vh,64px) 3vw 3vh}
.side{display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px);min-height:0;overflow:auto;padding-right:6px}
.kick{font-weight:700;letter-spacing:.2em;font-size:clamp(10px,1.1vw,13px);color:var(--green);text-transform:uppercase}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(54px,min(8vw,15vh),130px);line-height:.95;margin:.05em 0 0;text-transform:uppercase;display:inline-block;position:relative;align-self:flex-start}
h1:after{content:"";position:absolute;left:0;right:0;bottom:.06em;height:.34em;background:#bfe3f7;z-index:-1}
.sub{font-size:clamp(13px,1.25vw,17px);line-height:1.55;color:var(--muted);max-width:44ch}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.st{background:#fff;border-radius:14px;padding:8px 14px;box-shadow:0 6px 18px rgba(60,50,30,.13)}
.st b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(22px,2.6vw,34px);line-height:1.1;display:block}
.st span{font-size:clamp(10.5px,.85vw,12.5px);color:var(--muted);display:block;max-width:15ch;line-height:1.25}
.leg{display:flex;flex-direction:column;gap:6px}
.leg h3{margin:0 0 2px;font-size:clamp(10px,.9vw,12px);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cat{display:flex;align-items:center;gap:9px;border:0;background:rgba(255,255,255,.7);padding:7px 11px;border-radius:999px;font:600 clamp(11.5px,1vw,14px)/1.2 inherit;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left;transition:background .2s,opacity .2s}
.cat:hover{background:#fff}.cat i{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.cat em{margin-left:auto;font-style:normal;font-weight:700;color:var(--muted);padding-left:8px}
.cat.off{opacity:.42}.cat.off i{background:#fff!important}
.hint{font-size:clamp(11px,.9vw,13px);color:var(--muted)}
.map{position:relative;min-height:0;border-radius:24px;background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 1px rgba(60,50,30,.08);overflow:hidden;touch-action:none}
svg{width:100%;height:100%;display:block;cursor:grab}svg:active{cursor:grabbing}
.dep{fill:#f4ead0;stroke:#a99a74;stroke-width:1.4;vector-effect:non-scaling-stroke}
.mun{fill:none;stroke:#d3c4a0;stroke-width:.7;vector-effect:non-scaling-stroke}
.ra{stroke:#fff;stroke-width:.8;vector-effect:non-scaling-stroke;fill-opacity:.82;transition:fill-opacity .2s,opacity .2s}
.ra:hover,.ra.hi{fill-opacity:1;stroke:#1d2b33;stroke-width:1.5}
.ra.off{display:none}
.site{fill:#fff;fill-opacity:.2;stroke:#1d2b33;stroke-width:2.2;vector-effect:non-scaling-stroke}
.pin{position:absolute;width:0;height:0;border:0;background:none;padding:0;cursor:pointer;font-family:inherit;z-index:3}
.pin .lb{position:absolute}.pin.t .lb{left:0;bottom:20px;transform:translateX(-50%)}.pin.l .lb{right:20px;top:0;transform:translateY(-50%)}.pin.r .lb{left:20px;top:0;transform:translateY(-50%)}
.pin.t:hover .lb,.pin.t.on .lb{transform:translateX(-50%) scale(1.07)}.pin.l:hover .lb,.pin.l.on .lb{transform:translateY(-50%) scale(1.07)}.pin.r:hover .lb,.pin.r.on .lb{transform:translateY(-50%) scale(1.07)}
.pin .lb{background:var(--ink);color:#fff;font-weight:700;font-size:clamp(11px,1vw,14px);padding:5px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 5px 14px rgba(20,30,35,.3);transition:transform .2s,background .2s}
.pin:hover .lb,.pin.on .lb{background:var(--green)}
.pin .dt{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.pin .dt:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--green);animation:pl 2s infinite}
@keyframes pl{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
.tip{position:absolute;pointer-events:none;background:#fff;border-radius:12px;padding:8px 12px;font-size:12.5px;line-height:1.35;box-shadow:0 8px 22px rgba(40,35,20,.25);max-width:230px;opacity:0;transition:opacity .15s;z-index:5}
.tip b{display:block}.tip span{color:var(--muted)}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:4}
.zoom button{width:38px;height:38px;border-radius:12px;border:0;background:#fff;font-size:20px;font-weight:700;color:var(--ink);box-shadow:0 4px 12px rgba(40,35,20,.2);cursor:pointer}
.card{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.97);border-radius:18px;padding:12px 14px;box-shadow:0 12px 30px rgba(40,35,20,.28);display:none;gap:12px;align-items:center;max-width:min(430px,calc(100% - 24px));z-index:6}
.card.show{display:flex}
.card svg{width:84px;height:84px;flex:none;cursor:default;background:#eef3f0;border-radius:14px}
.card h4{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.card p{margin:3px 0 8px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.card a{display:inline-block;background:var(--green);color:#fff;border:0;border-radius:999px;padding:8px 15px;font:700 12.5px inherit;font-family:inherit;cursor:pointer}
.card .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
#logos{position:fixed;right:max(12px,3vw);top:10px;width:clamp(150px,19vw,280px);background:#fff;border-radius:12px;padding:5px 10px;box-shadow:0 6px 18px rgba(60,50,30,.16);z-index:8;pointer-events:none}
#logos img{display:block;width:100%;height:auto}
@media (max-width:860px){
 html,body{height:auto}
 .wrap{display:flex;flex-direction:column;height:auto;padding:58px 16px 24px;gap:14px}
 .side{overflow:visible;padding:0}
 h1{font-size:clamp(54px,19vw,110px)}
 .map{height:min(112vw,78vh);flex:none}
 .sub{max-width:none}
 #logos{width:150px;right:10px;top:8px;padding:4px 8px}
 .card{left:8px;right:8px;bottom:8px;top:auto;max-width:none}
 .legbox{order:3}
}
@media (max-width:860px) and (orientation:landscape){.map{height:90vh}}
@media (prefers-reduced-motion:reduce){.pin .dt:after{animation:none}}
</style></head><body>

 </section>
