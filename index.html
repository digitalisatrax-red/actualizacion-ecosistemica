<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Actualización ecosistémica</title>
<style>
:root{--bg:#fff6d9;--ink:#16222b}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
#f{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#sel{position:fixed;z-index:10;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:3px;background:rgba(255,253,245,.94);border-radius:999px;box-shadow:0 2px 12px rgba(22,34,43,.18)}
#sel button{border:0;background:transparent;color:var(--ink);font:600 13px/1 system-ui,Arial,sans-serif;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
#sel button:hover{background:rgba(43,154,120,.12)}#sel button.on{background:var(--ink);color:#fff}
#ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:600;background:var(--bg);z-index:5;transition:opacity .3s}
#ld.h{opacity:0;pointer-events:none}
@media(max-width:620px){#sel{max-width:calc(100vw - 16px);overflow-x:auto}#sel button{padding:8px 10px;font-size:12px}}
</style></head><body>
<div id="sel"></div><div id="ld">Cargando…</div><iframe id="f" allow="fullscreen" allowfullscreen></iframe>
<script>
var A=[
 {n:"Caldas",          f:"caldas.html"},
 {n:"Cerro Guadalupe", f:"cerro-guadalupe.html"},
 {n:"Lo Romeral 1",    f:"lo-romeral-1.html"},
 {n:"El Popal",        f:"el-popal.html"}
];
var sel=document.getElementById('sel'),fr=document.getElementById('f'),ld=document.getElementById('ld'),cur=-1,loadTimer=null;

function finishLoad(){if(loadTimer){clearTimeout(loadTimer);loadTimer=null}ld.className='h';try{fr.contentWindow.focus()}catch(e){}}

function show(i){
 if(i===cur)return;cur=i;
 for(var k=0;k<sel.children.length;k++)sel.children[k].className=(k===i?'on':'');
 if(loadTimer){clearTimeout(loadTimer);loadTimer=null}
 ld.className='';ld.textContent='Cargando '+A[i].n+'…';
 fr.onload=finishLoad;
 fr.onerror=function(){ld.textContent='No se pudo cargar '+A[i].n+'. Intenta recargar la página.'};
 fr.src=A[i].f;
 loadTimer=setTimeout(function(){
   if(fr.contentDocument&&fr.contentDocument.body&&fr.contentDocument.body.childNodes.length)finishLoad();
   else ld.textContent='No se pudo cargar la vista. Intenta recargar la página.';
 },30000);
 try{history.replaceState(null,'','#'+i)}catch(e){}
}

A.forEach(function(a,i){
 var b=document.createElement('button');b.textContent=a.n;
 b.onclick=function(){show(i)};sel.appendChild(b);
});

// precarga en segundo plano de las vistas no visibles, sin bloquear la actual
function prefetchRest(){
 A.forEach(function(a,i){
  if(i===cur)return;
  var l=document.createElement('link');l.rel='prefetch';l.href=a.f;document.head.appendChild(l);
 });
}

window.addEventListener('message',function(e){
 var s=e.data&&e.data.site;if(!s)return;
 for(var i=0;i<A.length;i++)if(A[i].n===s){show(i);break}
});

window.addEventListener('load',function(){setTimeout(prefetchRest,2000)});
show(Math.max(0,Math.min(A.length-1,parseInt(location.hash.slice(1))||0)));
</script></body></html>
